name: MABIZWA Scanner
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python mabizwa_bot.py